name: CI

# Continuous integration for MosRev (halalflow).
# Runs the repository's existing package.json scripts on every push and PR.
# Additive and non-breaking: introduces no new scripts and changes no app logic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Installs deps from package-lock.json. The repo's postinstall hook
      # runs `prisma generate`, which only reads prisma/schema.prisma (no DB).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No dedicated typecheck script exists in package.json, so invoke the
      # installed TypeScript compiler directly in --noEmit mode. This adds no
      # package.json script and modifies no source file.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
